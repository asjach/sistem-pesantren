Rekomendasikan belum layak jika ada masalah penting berbukti. Keputusan Done
tetap pengguna. Kembalikan hasil, bukti, pemeriksaan nyata, keterbatasan, dan
keputusan kepada Luffy; jangan mengaku review keamanan menjamin bebas bug.
